services:
  tesla-wrap-studio:
    build:
      context: .
      dockerfile: Dockerfile
    # Override WRAP_NAME to run a second (e.g. test) stack beside production.
    image: ${WRAP_NAME:-tesla-wrap-studio}:latest
    # Always rebuild from the checked-out source on deploy. Without this, Portainer
    # reuses an existing tesla-wrap-studio:latest image and new code never ships.
    pull_policy: build
    container_name: ${WRAP_NAME:-tesla-wrap-studio}
    # Host port is overridable: set WRAP_PORT in a .env file, or in Portainer's
    # "Environment variables" box on the stack, without editing this file.
    ports:
      - "${WRAP_PORT:-8095}:3000"
    restart: unless-stopped
