services:
  tesla-wrap-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: tesla-wrap-studio:latest
    container_name: tesla-wrap-studio
    # Host port is overridable: set WRAP_PORT in a .env file, or in Portainer's
    # "Environment variables" box on the stack, without editing this file.
    ports:
      - "${WRAP_PORT:-8095}:3000"
    volumes:
      # Generated wraps you choose to save land here, readable from any device
      # on your network. Override with WRAPS_PATH the same way as the port.
      - "${WRAPS_PATH:-/share/Docker/tesla-wrap-studio/wraps}:/app/wraps"
    restart: unless-stopped
