services:
  tesla-wrap-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: tesla-wrap-studio:latest
    container_name: tesla-wrap-studio
    # Change the left-hand number if 8088 is already taken on your NAS.
    ports:
      - "8088:3000"
    volumes:
      # Generated wraps you choose to save land here, readable from any device
      # on your network. Change the left-hand path to match your NAS.
      - /share/Docker/tesla-wrap-studio/wraps:/app/wraps
    restart: unless-stopped
