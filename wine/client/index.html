<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terroir — a wine atlas</title>
    <meta name="description" content="Explore 100K open wine ratings: grapes, regions, food pairings, critic scores and your own cellar." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%B7%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      (function () {
        var t = localStorage.getItem('terroir-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
